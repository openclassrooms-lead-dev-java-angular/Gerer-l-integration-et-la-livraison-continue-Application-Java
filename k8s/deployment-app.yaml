apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-organizer-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workshop-organizer-app
  template:
    metadata:
      labels:
        app: workshop-organizer-app
    spec:
      containers:
      - name: workshop-organizer-app
        image: ghcr.io/openclassrooms-lead-dev-java-angular/gerer-l-integration-et-la-livraison-continue-application-java:0.2.4
        ports:
        - containerPort: 8080
        env:
          - name: SPRING_DATASOURCE_URL
            value: jdbc:postgresql://workshop-organizer-db-service:5432/workshop-organizer-database

          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: workshop-organizer-db-secret
                key: username

          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: workshop-organizer-db-secret
                key: password

          - name: SPRING_JPA_HIBERNATE_DDL_AUTO
            value: "validate"

          - name: SPRING_JPA_SHOW_SQL
            value: "false
